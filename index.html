<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiger 5">
<title>Tiger 5 Golf Tracker</title>
<style>
:root{--bg:#eef1ee;--card:#fbfcfb;--ink:#12201a;--mut:#5b6b62;--line:#d5ddd7;--acc:#1d6b43;--acc-ink:#fff;--bad:#b8322a;--good:#1d6b43;--chip:#e2e9e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#16231b;--ink:#e7efe9;--mut:#98ab9f;--line:#2a3c31;--acc:#5cc58a;--acc-ink:#07140c;--bad:#ff8173;--good:#5cc58a;--chip:#21342a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1712;--card:#16231b;--ink:#e7efe9;--mut:#98ab9f;--line:#2a3c31;--acc:#5cc58a;--acc-ink:#07140c;--bad:#ff8173;--good:#5cc58a;--chip:#21342a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px 96px;max-width:640px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
header{padding:14px 0 6px}h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 6px}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.holes button{padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.holes .done{background:var(--chip)}
.holes .cur{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
h2+.row{border-top:0}
.stp{display:flex;align-items:center;gap:12px}
.stp b{min-width:34px;text-align:center;font:600 26px Georgia,"Times New Roman",serif}
.stp button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:22px}
.res{margin:2px 0 6px;font-weight:600;color:var(--acc)}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tg{padding:13px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.tg.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px}
.fl span{background:var(--bad);color:var(--acc-ink);border-radius:999px;padding:4px 10px}
.fl em{color:var(--good)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav2 button,.main{padding:14px;border-radius:10px;border:0;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:600}
.main{width:100%;margin-top:12px}
.main.alt{background:var(--chip);color:var(--ink)}
textarea{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px ui-monospace,Menlo,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--chip);border-radius:10px;padding:10px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font:600 20px Georgia,"Times New Roman",serif}
.tile.bad b{color:var(--bad)}.tile.good b{color:var(--good)}
.mut{color:var(--mut);margin:4px 0}
.del{border:0;background:none;color:var(--bad);font-size:14px;padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:14px;border:0;background:none;color:var(--mut);font-size:15px;font-weight:600}
nav .on{color:var(--acc)}
[hidden]{display:none}
.meta{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.meta label{font-size:12px;color:var(--mut)}
.meta input{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
.rd{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:var(--ink);font-size:16px;font-weight:600}
.rd small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.tbl{overflow-x:auto}
h3{font-size:15px;margin:0 0 8px}
.hint{margin:8px 0 0;color:var(--mut);font-size:13px}
.card>.tg{width:100%;margin-top:8px}
.s2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.cell small{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
.cell .stp{gap:8px}.cell .stp button{width:40px;height:40px;font-size:20px}.cell .stp b{min-width:24px;font-size:22px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta .seg2{grid-column:1/-1}
.avg{font-size:13px}.avg td:first-child,.avg th:first-child{text-align:left}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{flex:1;height:6px;background:var(--chip);border-radius:3px;margin:0 10px}
.bar i{display:block;height:100%;background:var(--bad);border-radius:3px}
.row b{min-width:24px;text-align:right}
.lbl{display:block;padding:14px;border-radius:10px;text-align:center;font-size:16px;font-weight:600;margin-top:12px;background:var(--chip);color:var(--ink);cursor:pointer}
summary{margin-top:14px;color:var(--acc);font-weight:600;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px;text-align:center}
th,td{padding:7px 4px;border-top:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
td.bad{color:var(--bad);font-weight:600}
.back{border:0;background:none;color:var(--acc);font-size:15px;font-weight:600;padding:8px 0}
</style></head><body>
<header><h1>Tiger 5 Tracker</h1><p>Saved on this device and backed up when you finish a round. GIR is worked out from score and putts.</p></header>
<main id="round"></main><main id="stats" hidden></main><main id="rounds" hidden></main>
<nav><button data-a="tab" data-k="round">Play</button><button data-a="tab" data-k="stats">Round</button><button data-a="tab" data-k="rounds">History</button></nav>
<script>
const $=id=>document.getElementById(id);
const KEY='tiger5-cur',HK='tiger5-hist';
const T5=['3-putts','Par 5 bogeys','Double bogeys+','Wedge bogeys','Missed easy up-and-downs'];
const mk=()=>Array.from({length:18},()=>({par:4,s:0,p:0,fw:0,rec:0,ch:0,bk:0,pen:0,tee:0,wd:0,eu:0}));
let st={h:mk(),i:0,course:'',date:'',type:'course'},hist=[],rev=null,flt='all',tab='round',arm=null,ref=null,cloud=null,bk={s:'load',m:''},io='',im='';
const cl=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fixSt=()=>{if(st.type!='sim')st.type='course';st.h.forEach(x=>{if(typeof x.pen!='number')x.pen=0;if(typeof x.tee!='number')x.tee=x.fw?1:x.rec?3:(x.s>0&&x.par>3?2:0)});if(typeof st.course!='string')st.course='';if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date||''))st.date=today()};
const fd=z=>(z.date?new Date(z.date+'T12:00:00'):new Date(z.d)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const cname=z=>z.course||'Course not named';
const rt=z=>z.type=='sim'?'sim':'course';
const typeSeg=(cur,a)=>`<div class="seg2">${[['course','On course'],['sim','Sim']].map(([v,l])=>`<button class="tg ${cur==v?'on':''}" data-a="${a}" data-k="${v}">${l}</button>`).join('')}</div>`;
function load(){
  try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&a.h&&a.h.length==18)st=a}catch(e){}
  try{const b=JSON.parse(localStorage.getItem(HK));if(Array.isArray(b))hist=b}catch(e){}
  fixSt();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(HK,JSON.stringify(hist))}catch(e){}}
async function initCloud(){
  try{
    if(typeof claude=='undefined'){bk.s='off';render();return}
    const u=await claude.use('user'),d=await claude.use('db'),id=u?await u.id():null;
    if(!d||!id){bk.s='off';render();return}
    ref=d.doc('data/users/'+id+'/latest');
    const sn=await ref.get();cloud=sn.exists?sn.data():null;bk.s='ok';
  }catch(e){bk.s='err'}
  render();
}
async function backup(merge){
  if(!ref)return;
  try{
    if(merge){
      const sn=await ref.get();cloud=sn.exists?sn.data():null;
      if(cloud&&Array.isArray(cloud.hist)){
        const seen=new Set(hist.map(z=>z.d));
        hist=hist.concat(cl(cloud.hist.filter(z=>!seen.has(z.d)))).sort((a,b)=>b.d-a.d);
      }
    }
    const body=cl({t:Date.now(),hist:hist,cur:st});
    await ref.set(body);cloud=body;bk.m='Backed up '+hist.length+' rounds.';
  }catch(e){bk.m='Backup failed. Your rounds are still saved on this device.'}
  render();
}
async function restore(){
  if(!ref)return;
  try{
    const sn=await ref.get(),c=sn.exists?sn.data():null;
    if(!c||!Array.isArray(c.hist)){bk.m='No backup found.'}
    else{
      cloud=c;hist=cl(c.hist);
      if(!st.h.some(y=>y.s>0)&&c.cur&&c.cur.h&&c.cur.h.length==18)st=cl(c.cur);fixSt();
      bk.m='Restored '+hist.length+' rounds.';
    }
  }catch(e){bk.m='Restore failed. Try again later.'}
  render();
}
function bkHtml(){
  const has=cloud&&Array.isArray(cloud.hist)&&cloud.hist.length;
  const s=bk.s=='load'?'Checking for a backup…':bk.s=='off'?'Cloud backup works when this page is opened in Claude while signed in.':bk.s=='err'?'Could not reach the backup right now.':has?`Latest backup: ${cloud.hist.length} rounds, saved ${new Date(cloud.t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}.`:'No backup yet. One is saved automatically when you finish a round.';
  return `<p class="mut">${s}</p>${bk.m?`<p class="res">${bk.m}</p>`:''}`+(bk.s=='off'?'':`<button class="main" data-a="bk">Back up now</button>`)+(has?`<button class="main alt" data-a="rest" ${hist.length?'data-c="rest"':''}>${arm=='rest'?'Tap again to replace the rounds on this device':'Restore from backup'}</button>`:'');
}
const nz=v=>Math.max(0,Math.min(20,Math.round(+v||0)));
const fh=y=>({par:Math.min(5,Math.max(3,Math.round(+y.par)||4)),s:nz(y.s),p:nz(y.p),fw:y.fw?1:0,rec:y.rec?1:0,ch:nz(y.ch),bk:nz(y.bk),pen:nz(y.pen),tee:Math.min(3,nz(y.tee))||(y.fw?1:y.rec?3:0),wd:y.wd?1:0,eu:y.eu?1:0});
async function doExport(){
  io=JSON.stringify({app:'tiger5',v:1,t:Date.now(),hist:hist,cur:st});
  let ok=false;
  try{await navigator.clipboard.writeText(io);ok=true}catch(e){}
  im=ok?'Copied. Paste it somewhere safe, like Notes.':'Select the text below and copy it.';
  render();
}
function doImport(){
  try{
    const o=JSON.parse(io.trim()),r=Array.isArray(o)?o:o.hist;
    if(!Array.isArray(r))throw 0;
    const seen=new Set(hist.map(z=>z.d));
    const add=r.filter(z=>z&&typeof z.d=='number'&&Array.isArray(z.h)&&z.h.length==18&&!seen.has(z.d)).map(z=>({d:z.d,h:z.h.map(fh),course:String(z.course||'').slice(0,60),date:/^\d{4}-\d{2}-\d{2}$/.test(z.date)?z.date:'',type:z.type=='sim'?'sim':'course'}));
    hist=hist.concat(add).sort((a,b)=>b.d-a.d);
    if(!Array.isArray(o)&&!st.h.some(y=>y.s>0)&&o.cur&&Array.isArray(o.cur.h)&&o.cur.h.length==18)st={h:o.cur.h.map(fh),i:0,course:String(o.cur.course||'').slice(0,60),date:o.cur.date,type:o.cur.type};fixSt();
    im='Added '+add.length+' round'+(add.length==1?'':'s')+'.';io='';
  }catch(e){im='That text is not a valid backup. Paste the full text you copied.'}
  render();
}
async function saveFile(name,text,type){
  try{
    const f=new File([text],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'Shared '+name+'. Choose Save to Files to keep it.'}
  }catch(e){if(e&&e.name=='AbortError')return 'Cancelled.'}
  try{
    if(typeof claude!='undefined'){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return 'Saved '+name+'.'}}
  }catch(e){}
  try{
    const u=URL.createObjectURL(new Blob([text],{type}));
    const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    return 'Downloaded '+name+'. Look in the Files app, under Downloads.';
  }catch(e){return 'Could not create the file. Use the text option instead.'}
}
async function doSaveFile(){
  im=await saveFile('tiger5-backup-'+today()+'.json',JSON.stringify({app:'tiger5',v:1,t:Date.now(),hist:hist,cur:st}),'application/json');
  render();
}
async function doCsv(){
  if(!hist.length){im='Save a round first.';render();return}
  const q=v=>{if(typeof v=='number')return String(v);v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=[['Date','Course','Round type','Hole','Par','Score','Putts','GIR','Fairway','Chips','Bunker shots','Penalty strokes','Recovery','Wedge in hand','Missed easy up-and-down','3-putt','Par 5 bogey','Double bogey+','Wedge bogey'].map(q).join(',')];
  hist.forEach(z=>z.h.forEach((x,i)=>{if(x.s>0){const f=flags(x);
    rows.push([z.date||new Date(z.d).toISOString().slice(0,10),z.course||'',rt(z)=='sim'?'Sim':'On course',i+1,x.par,x.s,x.p,x.s-x.p<=x.par-2?1:0,x.par>3?(x.fw?1:0):'',x.ch,x.bk,x.pen||0,x.rec,x.wd,x.eu,f.includes(0)?1:0,f.includes(1)?1:0,f.includes(2)?1:0,f.includes(3)?1:0].map(q).join(','))}}));
  im=await saveFile('tiger5-rounds-'+today()+'.csv',rows.join('\n'),'text/csv');
  render();
}
function ioHtml(){
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<p class="mut">Save a backup file to the Files app, iCloud Drive or email, then import it later. The spreadsheet file opens in Numbers or Excel.</p>${im?`<p class="res">${im}</p>`:''}<button class="main" data-a="sf">Save backup file</button><button class="main alt" data-a="sc">Save spreadsheet (CSV)</button><label class="lbl">Import from file<input id="fileIn" type="file" accept=".json,application/json,text/plain" hidden></label><details ${io?'open':''}><summary>Copy or paste as text instead</summary><textarea id="io" rows="5" placeholder="Backup text appears here, or paste a backup to import">${e(io)}</textarea><button class="main alt" data-a="exp">Copy backup text</button><button class="main alt" data-a="imp">Import pasted backup</button></details>`;
}
const vp=d=>d>0?'+'+d:d<0?String(d):'E';
const nm=d=>d<=-3?'Albatross':['Eagle','Birdie','Par','Bogey','Double bogey','Triple bogey'][d+2]||('+'+d);
function flags(x){
  const f=[];if(!x.s)return f;
  if(x.p>=3)f.push(0);
  if(x.par==5&&x.s>x.par)f.push(1);
  if(x.s-x.par>=2)f.push(2);
  if(x.wd&&x.s>x.par)f.push(3);
  if(x.eu)f.push(4);
  return f;
}
const AREAS=['Penalties','Tee shot trouble','Approach (missed green)','Short game','Putting'];
function causes(x){
  const c=[];if(!(x.s>x.par))return c;
  const gir=x.s-x.p<=x.par-2;
  if(x.pen>0)c.push(0);
  if(x.rec)c.push(1);
  if(!gir)c.push(2);
  if(!gir&&(x.ch>=2||x.bk>=2||x.eu))c.push(3);
  if(x.p>=3)c.push(4);
  return c;
}
function stats(h){
  const p=h.filter(x=>x.s>0),r={n:p.length,sc:0,par:0,pu:0,gir:0,fw:0,fwn:0,rec:0,ch:0,bk:0,pen:0,ov:0,un:0,sg:0,sgok:0,ar:[0,0,0,0,0],t:[0,0,0,0,0]};
  p.forEach(x=>{r.sc+=x.s;r.par+=x.par;r.pu+=x.p;if(x.s-x.p<=x.par-2)r.gir++;if(x.par>3){r.fwn++;if(x.fw)r.fw++}r.rec+=x.rec;r.ch+=x.ch;r.bk+=x.bk;r.pen+=x.pen||0;flags(x).forEach(i=>r.t[i]++);const c=causes(x);if(x.s>x.par){r.ov++;if(!c.length)r.un++;c.forEach(i=>r.ar[i]++)}if(x.s-x.p>x.par-2){r.sg++;if(x.s<=x.par)r.sgok++}});
  r.tt=r.t.reduce((a,b)=>a+b,0);return r;
}
function rRound(){
  const x=st.h[st.i],fl=flags(x),d=x.s-x.par,gir=x.s>0&&x.s-x.p<=x.par-2,cs=causes(x);
  const S=(l,k)=>`<div class="row"><span>${l}</span><div class="stp"><button data-a="m" data-k="${k}" aria-label="Decrease ${l}">−</button><b>${k=='s'&&!x.s?'–':x[k]}</b><button data-a="p" data-k="${k}" aria-label="Increase ${l}">+</button></div></div>`;
  const C=(l,k)=>`<div class="cell"><small>${l}</small><div class="stp"><button data-a="m" data-k="${k}" aria-label="Decrease ${l}">−</button><b>${x[k]}</b><button data-a="p" data-k="${k}" aria-label="Increase ${l}">+</button></div></div>`;
  const T=(l,k)=>`<button class="tg ${x[k]?'on':''}" data-a="t" data-k="${k}">${l}</button>`;
  const ban=(!hist.length&&cloud&&Array.isArray(cloud.hist)&&cloud.hist.length)?`<button class="main" data-a="rest">Backup found with ${cloud.hist.length} saved rounds. Tap to restore.</button>`:'';
  const tee=x.par>3?`<div class="card"><h3>Tee shot</h3><div class="seg">${[['Fairway',1],['Missed',2],['Recovery',3]].map(([l,v])=>`<button class="tg ${x.tee==v?'on':''}" data-a="tee" data-k="${v}">${l}</button>`).join('')}</div><p class="hint">Missed means you still had a normal shot at the green. Recovery means you had to punch out or play sideways.</p></div>`:'';
  $('round').innerHTML=`${ban}<div class="card meta"><label>Course<input id="course" list="cs" value="${esc(st.course)}" placeholder="Course name" autocomplete="off"></label><label>Date<input id="date" type="date" value="${esc(st.date)}"></label><datalist id="cs">${[...new Set(hist.map(z=>z.course).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>${typeSeg(st.type,'rt')}</div>
<div class="holes">${st.h.map((y,i)=>`<button data-a="h" data-k="${i}" class="${i==st.i?'cur':''} ${y.s?'done':''}">${i+1}</button>`).join('')}</div>
<div class="card"><h2>Hole ${st.i+1}</h2>${S('Par','par')}${S('Score','s')}<p class="res">${x.s?nm(d):'Tap + to enter your score'}</p></div>
${tee}
<div class="card"><h3>Approach</h3>${x.par==3?T('Tee shot needed a recovery','rec'):''}${T('Wedge in hand','wd')}<p class="hint">Tap Wedge in hand if you hit a wedge into the green. A bogey or worse then counts as a wedge bogey.</p>${x.s?`<p class="res">${gir?'Green in regulation':'Missed the green'}</p>`:''}</div>
<div class="card"><h3>Short game</h3><div class="s2">${C('Chips','ch')}${C('Bunker shots','bk')}</div>${T('Missed easy up-and-down','eu')}<p class="hint">Tap this if you missed a short, simple save around the green.</p></div>
<div class="card"><h3>Putting and penalties</h3><div class="s2">${C('Putts','p')}${C('Penalty strokes','pen')}</div></div>
<div class="card"><h3>This hole</h3><div class="fl">${fl.length?fl.map(i=>`<span>${T5[i]}</span>`).join(''):(x.s?'<em>No Tiger 5 mistakes</em>':'<em>Enter a score to see how the hole went</em>')}</div>${cs.length?`<p class="mut">Cost areas: ${cs.map(i=>AREAS[i]).join(', ')}</p>`:''}</div>
<div class="nav2"><button data-a="pv">Previous hole</button><button data-a="nx">Next hole</button></div>`;
}
const sec=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;
const g=a=>`<div class="grid">${a.map(([l,v,c])=>`<div class="tile ${c||''}"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`;
const pc=(a,b)=>b?Math.round(100*a/b)+'%':'–';
function costHtml(r){
  if(!r.ov)return '<p class="mut">No holes over par yet.</p>';
  const o=AREAS.map((l,i)=>[l,r.ar[i]]).sort((a,b)=>b[1]-a[1]);
  return o.map(([l,c])=>`<div class="row"><span>${l}</span><div class="bar"><i style="width:${Math.round(100*c/r.ov)}%"></i></div><b>${c}</b></div>`).join('')+`<p class="mut">${r.ov} holes over par${r.un?`, ${r.un} with no flagged cause`:''}. A hole can have more than one cause.</p><details><summary>How causes are counted</summary><p class="mut">Only holes over par count. Penalties: any penalty stroke. Tee shot trouble: a recovery shot was needed. Approach: the green was missed. Short game: green missed and 2 or more chips, 2 or more bunker shots, or a missed easy up-and-down. Putting: 3 or more putts.</p></details>`;
}
function rStats(){
  const r=stats(st.h);
  $('stats').innerHTML=
    sec('Tiger 5 this round',g(T5.map((l,i)=>[l,r.t[i],r.t[i]?'bad':'good'])))+
    sec('What cost you shots',costHtml(r))+
    sec(`${esc(st.course||'This round')} (${st.type=='sim'?'Sim':'On course'}), ${r.n} of 18 holes`,g([
      ['Score',r.n?`${r.sc} (${vp(r.sc-r.par)})`:'–'],
      ['Putts',r.n?`${r.pu} (${(r.pu/r.n).toFixed(1)} a hole)`:'–'],
      ['Greens in regulation',`${r.gir}/${r.n} (${pc(r.gir,r.n)})`],
      ['Fairways hit',`${r.fw}/${r.fwn} (${pc(r.fw,r.fwn)})`],
      ['Recovery shots',r.rec],['Chips',r.ch],['Bunker shots',r.bk],['Penalty strokes',r.pen],['Scrambling',`${r.sgok}/${r.sg} (${pc(r.sgok,r.sg)})`]
    ])+`<button class="main" data-a="fin" data-c="fin">${arm=='fin'?'Tap again to save and start a new round':'Finish and save round'}</button>`);
}
function rReview(z,j){
  const q=stats(z.h),sh=['3P','P5','DB','WB','UD'];
  const rows=z.h.map((x,i)=>[x,i]).filter(([x])=>x.s>0).map(([x,i])=>{const f=flags(x);
    return `<tr><td>${i+1}</td><td>${x.par}</td><td><b>${x.s}</b></td><td>${x.p}</td><td>${x.s-x.p<=x.par-2?'✓':'–'}</td><td>${x.par>3?(x.fw?'✓':'–'):''}</td><td>${x.ch}</td><td>${x.bk}</td><td>${x.rec}</td><td>${x.pen||0}</td><td class="${f.length?'bad':''}">${f.map(n=>sh[n]).join(' ')||'–'}</td></tr>`}).join('');
  return `<button class="back" data-a="back">Back to rounds</button>`+sec('Round type',typeSeg(rt(z),'rtype'))+
    sec(`${esc(cname(z))}, ${fd(z)}`,g([
      ['Score',`${q.sc} (${vp(q.sc-q.par)})`],['Holes played',q.n],
      ['Putts',`${q.pu} (${q.n?(q.pu/q.n).toFixed(1):'–'} a hole)`],
      ['Greens in regulation',`${q.gir}/${q.n} (${pc(q.gir,q.n)})`],
      ['Fairways hit',`${q.fw}/${q.fwn} (${pc(q.fw,q.fwn)})`],
      ['Recovery shots',q.rec],['Chips',q.ch],['Bunker shots',q.bk],['Penalty strokes',q.pen],['Scrambling',`${q.sgok}/${q.sg} (${pc(q.sgok,q.sg)})`]]))+
    sec('Tiger 5 in this round',g(T5.map((l,i)=>[l,q.t[i],q.t[i]?'bad':'good'])))+
    sec('What cost you shots',costHtml(q))+
    sec('Hole by hole',`<div class="tbl"><table><tr><th>Hole</th><th>Par</th><th>Score</th><th>Putts</th><th>GIR</th><th>FW</th><th>Chip</th><th>Bkr</th><th>Rec</th><th>Pen</th><th>Tiger 5</th></tr>${rows}</table></div><p class="mut">3P three-putt, P5 par 5 bogey or worse, DB double bogey or worse, WB wedge bogey, UD missed easy up-and-down.</p>`)+
    `<button class="main alt" data-a="del" data-c="del" data-k="${j}">${arm=='del'+j?'Tap again to delete this round':'Delete this round'}</button>`;
}
function backupCard(){
  return `<div class="card"><details ${im||bk.m||io?'open':''}><summary>Backup and data</summary>${bk.s=='off'?'':'<h3 style="margin-top:14px">Cloud backup</h3>'+bkHtml()}<h3 style="margin-top:14px">Files</h3>${ioHtml()}</details></div>`;
}
function rRounds(){
  if(rev!==null&&hist[rev]){$('rounds').innerHTML=rReview(hist[rev],rev);return}
  rev=null;
  if(!hist.length){$('rounds').innerHTML=sec('History','<p class="mut">Finish and save a round on the Round tab to see your averages and review it here.</p>')+backupCard();return}
  const ok=z=>flt=='all'||rt(z)==flt,F=hist.filter(ok);
  const grp=h=>({q:stats(h.flatMap(z=>z.h)),n:h.length,full:h.map(z=>stats(z.h)).filter(w=>w.n==18).map(w=>w.sc)});
  const G=[grp(hist),grp(hist.filter(z=>rt(z)=='course')),grp(hist.filter(z=>rt(z)=='sim'))];
  const pa=(c,v)=>c.n?(v/c.n).toFixed(1):'–';
  const R=[['Rounds',c=>c.n],
    ['Average score',c=>c.full.length?(c.full.reduce((a,b)=>a+b,0)/c.full.length).toFixed(1):'–'],
    ['Best score',c=>c.full.length?Math.min(...c.full):'–'],
    ['Greens in regulation',c=>pc(c.q.gir,c.q.n)],['Fairways hit',c=>pc(c.q.fw,c.q.fwn)],['Scrambling',c=>pc(c.q.sgok,c.q.sg)],
    ['Putts a hole',c=>c.q.n?(c.q.pu/c.q.n).toFixed(1):'–'],
    ...T5.map((l,i)=>[l+' a round',c=>pa(c,c.q.t[i])]),
    ['Penalties a round',c=>pa(c,c.q.pen)],['Recovery shots a round',c=>pa(c,c.q.rec)],['Chips a round',c=>pa(c,c.q.ch)],['Bunker shots a round',c=>pa(c,c.q.bk)]];
  const tbl=`<div class="tbl"><table class="avg"><tr><th></th><th>Overall</th><th>On course</th><th>Sim</th></tr>${R.map(([l,f])=>`<tr><td>${l}</td>${G.map(c=>`<td>${f(c)}</td>`).join('')}</tr>`).join('')}</table></div><p class="mut">Score averages use rounds with all 18 holes. The rest are per round or per hole played.</p>`;
  const list=hist.map((z,j)=>[z,j]).filter(([z])=>ok(z)).map(([z,j])=>{const q=stats(z.h);return `<button class="rd" data-a="open" data-k="${j}">${esc(cname(z))}<small>${fd(z)}, ${rt(z)=='sim'?'Sim':'On course'}: ${q.n<18?q.n+' holes, ':''}${q.sc} (${vp(q.sc-q.par)}), ${q.tt} Tiger 5 misses</small></button>`}).join('');
  const f3=`<div class="seg">${[['all','All'],['course','On course'],['sim','Sim']].map(([v,l])=>`<button class="tg ${flt==v?'on':''}" data-a="flt" data-k="${v}">${l}</button>`).join('')}</div>`;
  $('rounds').innerHTML=
    `<div class="card">${f3}<p class="hint">Filters the cost ranking and the round list below.</p></div>`+
    sec('What costs you shots',costHtml(stats(F.flatMap(z=>z.h))))+
    sec('Averages',tbl)+
    sec('Saved rounds',(list||'<p class="mut">No rounds of this type yet.</p>')+'<p class="mut">Tap a round to review it hole by hole.</p>')+
    backupCard();
}
function render(){
  $('round').hidden=tab!='round';$('stats').hidden=tab!='stats';$('rounds').hidden=tab!='rounds';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==tab));
  if(tab=='round')rRound();else if(tab=='stats')rStats();else rRounds();
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,x=st.h[st.i];
  let post=null;
  if(b.dataset.c){const key=b.dataset.c+(k||'');if(arm!=key){arm=key;render();return}arm=null}else arm=null;
  if(a=='m'||a=='p'){
    const d=a=='p'?1:-1;let v=x[k];
    v=(k=='s'&&v==0&&d==1)?x.par:v+d;
    x[k]=Math.max(k=='par'?3:0,Math.min(k=='par'?5:k=='s'?15:10,v));
  }else if(a=='t'){x[k]=x[k]?0:1}
  else if(a=='tee'){x.tee=x.tee==+k?0:+k;x.fw=x.tee==1?1:0;x.rec=x.tee==3?1:0}
  else if(a=='h'){st.i=+k}
  else if(a=='nx'){st.i=Math.min(17,st.i+1)}
  else if(a=='pv'){st.i=Math.max(0,st.i-1)}
  else if(a=='tab'){tab=k;if(k!='rounds')rev=null}
  else if(a=='open'){rev=+k}
  else if(a=='back'){rev=null}
  else if(a=='rt'){st.type=k}
  else if(a=='rtype'){if(hist[rev]){hist[rev].type=k;if(ref){bk.m='Backing up…';post=()=>backup(false)}}}
  else if(a=='flt'){flt=k}
  else if(a=='fin'){if(st.h.some(y=>y.s>0)){hist.unshift({d:Date.now(),h:st.h,course:st.course.trim().slice(0,60),date:st.date,type:st.type});st={h:mk(),i:0,course:'',date:today(),type:st.type};tab='rounds';rev=null;if(ref){bk.m='Backing up…';post=()=>backup(true)}else bk.m=''}}
  else if(a=='del'){hist.splice(+k,1);rev=null;if(ref){bk.m='Backing up…';post=()=>backup(false)}}
  else if(a=='bk'){if(ref){bk.m='Backing up…';post=()=>backup(true)}else bk.m='Backup is not ready yet. Try again in a moment.'}
  else if(a=='rest'){bk.m='Restoring…';post=restore}
  else if(a=='exp'){post=doExport}
  else if(a=='imp'){post=doImport}
  else if(a=='sf'){post=doSaveFile}
  else if(a=='sc'){post=doCsv}
  render();if(post)post();
});
document.addEventListener('change',async e=>{if(e.target.id=='fileIn'&&e.target.files&&e.target.files[0]){try{io=await e.target.files[0].text()}catch(x){im='Could not read that file.';render();return}doImport()}});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='io')io=e.target.value;else if(i=='course'){st.course=e.target.value;save()}else if(i=='date'){st.date=e.target.value;save()}});
load();render();initCloud();
</script></body></html>
